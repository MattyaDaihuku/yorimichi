name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keepalive endpoint
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${KEEPALIVE_URL:-}" ]; then
            echo "KEEPALIVE_URL is not set. Add it as a repository variable."
            exit 1
          fi

          BASE_URL="${KEEPALIVE_URL%/}"
          curl -fsS "$BASE_URL/api/keepalive"