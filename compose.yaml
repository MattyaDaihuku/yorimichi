# ==============================================================================
# GitChat Docker Compose 設定
# ==============================================================================
# 使い方:
#   初回:    docker compose up --build
#   以降:    docker compose up
#   停止:    docker compose down
#   リセット: docker compose down -v  (ボリュームも削除)
#
# パッケージ追加:
#   docker compose exec app npm install <package-name>
#
# Prisma マイグレーション:
#   docker compose exec app npx prisma migrate dev
# ==============================================================================

services:
  app:
    build:
      context: .
    container_name: gitchat-dev
    ports:
      - "3000:3000"

    volumes:
      # ソースコード同期 (ホスト ⇔ コンテナ 双方向)
      - .:/app

      # ----- 以下はコンテナ内にのみ存在させる (GitHub に上げるべきでないもの) -----
      # node_modules: npm パッケージ
      - node_modules:/app/node_modules
      # .next: Next.js ビルドキャッシュ
      - next_cache:/app/.next

    env_file:
      - .env.local

    environment:
      # Windows / WSL2 環境でのファイル変更検知にポーリングを使用
      - WATCHPACK_POLLING=true
      - NODE_ENV=development

    # 手動停止以外で異常終了した場合は自動再起動
    restart: unless-stopped

# ---------- 名前付きボリューム ----------
# ホストにはマウントされず、コンテナ内にのみ存在する
volumes:
  node_modules:
    driver: local
  next_cache:
    driver: local
